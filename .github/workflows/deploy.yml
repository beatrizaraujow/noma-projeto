name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Os secrets da Vercel podem nao estar configurados no repositorio (por
      # exemplo, quando o frontend e publicado pela integracao Git da propria
      # Vercel). Sem esse check o step abaixo derruba o workflow inteiro com
      # "Input required and not supplied: vercel-token".
      - name: Checa credenciais da Vercel
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy pela Action pulado: configure os secrets VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID no repositorio para habilita-lo."
          fi

      - name: Deploy to Vercel (Web)
        if: steps.vercel.outputs.configurado == 'true'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web

      # Add Railway deployment or other deployment steps here
