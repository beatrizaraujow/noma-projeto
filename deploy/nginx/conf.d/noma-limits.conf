# =============================================================================
# NOMA - diretivas de contexto `http`
# Destino: /etc/nginx/conf.d/noma-limits.conf
#
# POR QUE ESTE ARQUIVO EXISTE, SEPARADO DO VHOST
#
# `limit_req_zone`, `limit_conn_zone` e `map` sao validos APENAS no contexto
# `http`. O nginx.conf da raiz deste repositorio tinha `limit_req_zone` dentro de
# um bloco `server` (linha 49) — com isso `nginx -t` falha, e se alguem tentar
# resolver com `systemctl restart` em vez de `reload`, OS DOIS SITES CAEM
# (secao 6.2 do docs/INFRA_COEXISTENCIA_SERVIDOR.md).
#
# /etc/nginx/conf.d/*.conf e incluido dentro do bloco `http` na config padrao do
# Debian/Ubuntu, entao este e o lugar correto.
# =============================================================================

# Rate limit por IP na API. O `noma_` no nome da zona evita colisao com zonas
# que o SB Clips talvez ja tenha definido — nome duplicado quebra o nginx -t.
limit_req_zone $binary_remote_addr zone=noma_api_limit:10m rate=20r/s;

# Teto de conexoes simultaneas por IP.
limit_conn_zone $binary_remote_addr zone=noma_conn:10m;

# Handshake de WebSocket. Nome proprio de proposito: se o vhost do SB Clips ja
# declara `map $http_upgrade $connection_upgrade`, redeclarar o mesmo nome faz o
# nginx -t falhar.
map $http_upgrade $noma_connection_upgrade {
    default upgrade;
    ''      close;
}
